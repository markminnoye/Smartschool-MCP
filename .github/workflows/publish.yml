name: Release

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. Build distribution ───────────────────────────────────────────────────
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Verify distribution
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/

  # ── 2. Publish to PyPI ──────────────────────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/smartschool-mcp
    permissions:
      id-token: write  # OIDC trusted publishing – no API key required
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  # ── 3. Publish to MCP Registry ──────────────────────────────────────────────
  publish-mcp:
    name: Publish to MCP Registry
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Stamp server.json with release version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          python - <<EOF
          import json, pathlib
          p = pathlib.Path("server.json")
          data = json.loads(p.read_text())
          data["version"] = "$VERSION"
          data["packages"][0]["version"] = "$VERSION"
          p.write_text(json.dumps(data, indent=2) + "\n")
          EOF

      # Pinned version and checksum: this job holds an OIDC token, so it must
      # not run whatever "latest" happens to be. Bump both together.
      - name: Install MCP Publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.16
          MCP_PUBLISHER_SHA256: 6e2f799550cf843c6fd3350498d56cc49be3dc0af1e6237eb0e6435c7a9d5c05
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Authenticate with MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish

      # Claude Desktop .mcpb is attached by .github/workflows/mcpb.yml on the
      # same release:published event (asset smartschool-mcp-<version>.mcpb).
