# Sonic Rocket demo: single-user Streamable HTTP MCP on Fly.io.
# App name is a suggestion — change it if the name is taken.
# Secrets stay in `fly secrets set`, not here.

app = "smartschool-mcp-sonicrocket"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  MCP_TRANSPORT = "streamable-http"
  MCP_HOST = "0.0.0.0"
  MCP_PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

# No unauthenticated HTTP health path exists. GET /mcp returns 401 when
# MCP_API_KEY is set; OPTIONS is for CORS preflight, not Fly HTTP checks
# (those require 2xx). TCP on the listen port is the correct probe.
[checks]
  [checks.tcp8000]
    type = "tcp"
    port = 8000
    grace_period = "10s"
    interval = "15s"
    timeout = "2s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
