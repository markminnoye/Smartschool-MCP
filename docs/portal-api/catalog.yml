    notes: >
      HTML child-switch redirect. Path id is an account id from getStudents;
      do not commit it. Cross-school children 302 to ``/otp/{token}`` on the
      other host. A trusted browser then 302s from OTP with relative
      ``Location: /Studentcard`` (no ``/login``, no ``/account-verification``).
      Follow hop-by-hop, retarget ``main_url``, and do not POST this session's
      password if OTP instead lands on ``/login``. After the redirect,
      planner/results follow the new child.


