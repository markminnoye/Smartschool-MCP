# Sanitized portal endpoint catalog. No response bodies, cookies, tokens, or names.
# Schema: docs/portal-api/README.md
#
# Sources:
# - Chrome HAR docs/portal-api/raw/dering.smartschool.be.har (gitignored), 2026-09-17
#   parent/co-account on depass.smartschool.be and dering.smartschool.be
#   (file overwritten later the same day: De Ring Intradesk / Zoeken / Vakken
#   course folders, then again with Meldingen /Profile/Notify; keys merged below)
# - Chrome HAR docs/portal-api/raw/switch-child-depass-to-dering.har (gitignored), 2026-09-22
#   Mijn kinderen switch: gotourl → /otp/{token} → relative /Studentcard
#   (planner-calendar-1to1: omit types by default, PinnedPlannedElements)
#
# observed_on: "depass.smartschool.be parent/co-account"
#              | "dering.smartschool.be parent/co-account"
#              | "library"

endpoints:

  # --- Planner ---
  - method: GET
    path: /planner/api/v1/planned-elements/user/{userId}
    query_keys: [from, to]
    body_keys: []
    module: planner
    observed_on: depass.smartschool.be parent/co-account
    library: PlannedElements
    mcp_tool: get_planned_elements
    notes: >
      Calendar grid omits `types` and `includes`. Types seen in the unfiltered response:
      planned-lessons, planned-school-activities, planned-lesson-cluster-moments,
      planned-placeholders, planned-assignments. Library default now matches this GET
      (optional types/includes). MCP get_schedule and get_planned_elements both call
      this path.

  - method: GET
    path: /planner/api/v1/planned-elements/user/{userId}
    query_keys: [from, to, includes, types]
    body_keys: []
    module: planner
    observed_on: depass.smartschool.be parent/co-account
    library: PlannedElements
    mcp_tool: get_planned_elements
    notes: >
      Sidebar subset. Observed includes=icon,courses,locations,upload-folders,labels and
      types=planned-to-dos,planned-lesson-cluster-assignments,planned-assignments (also
      planned-generics, planned-lesson-free-days, planned-meetings, planned-school-activities
      on other filtered calls). Library/MCP pass optional `types` and `includes`.

  - method: GET
    path: /planner/api/v1/planned-elements/pinned
    query_keys: [includes]
    body_keys: []
    module: planner
    observed_on: depass.smartschool.be parent/co-account
    library: PinnedPlannedElements
    mcp_tool: none
    notes: Observed includes=icon,courses,locations,upload-folders (and labels on this crawl).

